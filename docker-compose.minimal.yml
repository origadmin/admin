version: "3.8"

#
# OrigAdmin Backend - Recommended Minimal Configuration
#
# This is the preferred docker-compose configuration file for the project
# Contains only the project's own microservices, no third-party infrastructure
#
# ✅ Advantages:
# - Completely avoids legal risks (no AGPL/SSPL or other restrictive license components)
# - Clean and simple configuration
# - Supports flexible deployment (cloud provider managed or self-hosted infrastructure)
# 
# 📋 Requirements:
# - Infrastructure services need separate deployment
# - Supports multiple deployment methods:
#   * Development: Use resources/dev-tools/docker-compose.yml
#   * Production: Use cloud provider managed services (AWS RDS, Google Cloud SQL, etc.)
#   * Self-hosted: Independently deploy NATS, Consul, PostgreSQL, Redis
#
# 🔧 Configuration Methods:
# 1. Environment variables (recommended for containerized deployment)
# 2. Configuration files (recommended for traditional deployment)
#

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    ports:
      - "8000:8000" # HTTP port
      - "9000:9000" # gRPC port
    volumes:
      - .:/app
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration (adjust according to actual deployment)
    # environment:
    #   # NATS message queue
    #   - NATS_SERVER_URL=nats://localhost:4222
    #   # Consul service discovery
    #   - KRATOS_DISCOVERY_CONSUL_ADDRESS=localhost:8500
    #   # PostgreSQL database
    #   - POSTGRES_URL=postgresql://user:password@localhost:5432/origadmin
    #   # Redis cache
    #   - REDIS_URL=redis://localhost:6379

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    volumes:
      - .:/app
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration
    # environment:
    #   - NATS_SERVER_URL=nats://localhost:4222
    #   - KRATOS_DISCOVERY_CONSUL_ADDRESS=localhost:8500
    #   - POSTGRES_URL=postgresql://user:password@localhost:5432/origadmin
    #   - REDIS_URL=redis://localhost:6379

  system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: system
    volumes:
      - .:/app
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration
    # environment:
    #   - NATS_SERVER_URL=nats://localhost:4222
    #   - KRATOS_DISCOVERY_CONSUL_ADDRESS=localhost:8500
    #   - POSTGRES_URL=postgresql://user:password@localhost:5432/origadmin
    #   - REDIS_URL=redis://localhost:6379

networks:
  default:
    name: origadmin-network