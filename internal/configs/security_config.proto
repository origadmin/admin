syntax = "proto3";
package origadmin.configs.api;

import "config/v1/security.proto";
import "configs/captcha.proto";
import "configs/root_user.proto";

option go_package = "origadmin/application/admin/internal/configs";

message SecurityConfig {
  RootUser root_user = 1 [json_name = "root_user"];
  Captcha captcha = 2 [json_name = "captcha"];

  config.v1.Security security = 3 [json_name = "security"];
}
