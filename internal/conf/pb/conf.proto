syntax = "proto3";

package conf.pb;

import "config/data/v1/data.proto";
import "config/discovery/v1/discovery.proto";
import "config/logger/v1/logger.proto";
import "config/middleware/v1/middleware.proto";
import "config/transport/v1/transport.proto";
import "internal/conf/pb/captcha.proto";
import "internal/conf/pb/root.proto";
import "security/v1/security.proto";

option go_package = "origadmin/application/admin/internal/conf/pb;confpb";

// Bootstrap is the top-level configuration structure for the application.
message Bootstrap {
  // Server-side configuration for the service itself.
  runtime.api.config.transport.v1.Servers servers = 1;

  // Client-side configurations. The key is the logical name of the downstream service, e.g., "user-service".
  runtime.api.config.transport.v1.Clients clients = 2;

  // Global-level configurations can be placed here.
  SelectorGlobal selector_global = 3;

  // Data configuration, including databases, caches, and object stores.
  runtime.api.config.data.v1.Data data = 4;

  // Discovery configuration for service discovery.
  runtime.api.config.discovery.v1.Discoveries discoveries = 5;

  // Logger configuration for application logging.
  runtime.api.config.logger.v1.Logger logger = 6;

  // Middleware configuration for request processing.
  runtime.api.config.middleware.v1.Middlewares middlewares = 7;

  // Security configuration for authentication and authorization.
  contrib.api.security.v1.Security security = 8;

//  // CORS configuration for cross-origin resource sharing.
//  runtime.api.config.middleware.cors.v1.Cors cors = 9;

  // Captcha feature specific configuration.
  conf.pb.Captcha captcha = 10;

  // RootUser feature specific configuration for initial user setup.
  conf.pb.RootUser root_user = 11;

  // Default discovery service name.
  string default_discovery = 12;
}

// SelectorGlobal defines the global selector/load-balancing strategy.
message SelectorGlobal {
  // builder specifies the global load balancer, e.g., "p2c", "wrr", "random".
  string builder = 1;
}
