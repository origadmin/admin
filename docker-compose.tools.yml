services:
  consul:
    image: hashicorp/consul:1.22.2
    container_name: backend_consul
    command: "agent -server -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "8500:8500" # HTTP API
      - "8600:8600/tcp" # DNS API (TCP)
      - "8600:8600/udp" # DNS API (UDP)

  nats:
    image: nats:2.12.3-alpine
    container_name: backend_nats
    command: "--config /etc/nats/nats.conf" # Use the mounted config file
    ports:
      - "14222:4222" # NATS client port
      - "18222:8222" # NATS monitoring port
    volumes:
      - ./resources/tools/nats/nats.conf:/etc/nats/nats.conf # Mount the local config file

  redis:
    image: redis:8.4.0-alpine
    container_name: backend_redis
    ports:
      - "6379:6379" # Redis client port

  postgres:
    image: postgres:18.1-alpine
    container_name: backend_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: origadmin
    ports:
      - "5432:5432" # PostgreSQL client port
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
