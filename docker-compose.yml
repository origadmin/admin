version: "3.8"

services:
  consul:
    image: hashicorp/consul:1.22.2
    container_name: consul
    command: "agent -server -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "8500:8500" # HTTP API
      - "8600:8600/tcp" # DNS API (TCP)
      - "8600:8600/udp" # DNS API (UDP)

  nats:
    image: nats:2.12.3 # Changed from nats:2.9 to nats:latest
    container_name: nats
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring port

  gateway:
    build:
      context: .
      dockerfile: Dockerfile # Use the root Dockerfile
      args:
        SERVICE_NAME: gateway # Pass the service name as a build argument
    ports:
      - "8000:8000" # Expose gateway's HTTP port
      - "9000:9000" # Expose gateway's gRPC port
    volumes:
      - .:/app # Mount the entire project directory to enable live reload
    depends_on:
      - auth
      - system
      - nats
      - consul # Add dependency on consul
    environment:
      # Configure Kratos to use Consul for service discovery
      # This assumes your Kratos app is configured to read these env vars
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222 # Add NATS server URL for gateway

  auth:
    build:
      context: .
      dockerfile: Dockerfile # Use the root Dockerfile
      args:
        SERVICE_NAME: auth # Pass the service name as a build argument
    volumes:
      - .:/app
    depends_on:
      - nats
      - consul # Add dependency on consul
    environment:
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222 # Add NATS server URL for auth service

  system:
    build:
      context: .
      dockerfile: Dockerfile # Use the root Dockerfile
      args:
        SERVICE_NAME: system # Pass the service name as a build argument
    volumes:
      - .:/app
    depends_on:
      - nats
      - consul # Add dependency on consul
    environment:
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222 # Add NATS server URL for system
