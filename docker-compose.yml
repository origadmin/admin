version: "3.8"

#
# OrigAdmin Backend - Clean Application Services Configuration
#
# This is the main application docker-compose configuration file
# Contains only the project's own microservices, no third-party infrastructure
# 
# Usage Instructions:
# 1. Infrastructure services (NATS, Consul, PostgreSQL, Redis, etc.) need separate deployment
# 2. Infrastructure connection information can be specified via environment variables or config files
# 3. For development environment, use resources/dev-tools/docker-compose.yml to quickly start infrastructure
#

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    ports:
      - "8000:8000" # HTTP port
      - "9000:9000" # gRPC port
    volumes:
      - .:/app
      # Mount configuration file directory
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration provided via environment variables or config files
    # Example environment variables (adjust according to actual deployment):
    # environment:
    #   - NATS_SERVER_URL=nats://localhost:4222
    #   - KRATOS_DISCOVERY_CONSUL_ADDRESS=localhost:8500
    #   - POSTGRES_URL=postgresql://user:password@localhost:5432/origadmin
    #   - REDIS_URL=redis://localhost:6379

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    volumes:
      - .:/app
      # Mount configuration file directory
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration provided via environment variables or config files

  system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: system
    volumes:
      - .:/app
      # Mount configuration file directory
      - ./resources/configs:/app/resources/configs:ro
    # Infrastructure connection configuration provided via environment variables or config files

networks:
  default:
    name: origadmin-network