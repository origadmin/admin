version: "3.8"

#
# OrigAdmin Backend - Default Docker Compose Configuration
#
# This configuration uses:
# - Consul (MPL 2.0): Service discovery and configuration
# - NATS (Apache 2.0): Message queue
#
# License Notice:
# Consul uses Mozilla Public License 2.0 (MPL 2.0).
# MPL 2.0 is file-level copyleft: if you modify Consul's source code,
# you must release those modifications. Using Consul as-is does NOT require
# you to open source your application code.
#
# For a completely license-free alternative, consider using docker-compose.minimal.yml
# which removes service discovery and uses direct networking.
#

services:
  consul:
    image: hashicorp/consul:1.22.2
    container_name: consul
    command: "agent -server -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "8500:8500" # HTTP API
      - "8600:8600/tcp" # DNS API (TCP)
      - "8600:8600/udp" # DNS API (UDP)

  nats:
    image: nats:2.12.3
    container_name: nats
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # NATS monitoring port

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway
    ports:
      - "8000:8000" # Expose gateway's HTTP port
      - "9000:9000" # Expose gateway's gRPC port
    volumes:
      - .:/app
    depends_on:
      - auth
      - system
      - nats
      - consul
    environment:
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth
    volumes:
      - .:/app
    depends_on:
      - nats
      - consul
    environment:
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222

  system:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: system
    volumes:
      - .:/app
    depends_on:
      - nats
      - consul
    environment:
      KRATOS_DISCOVERY_CONSUL_ADDRESS: consul:8500
      NATS_SERVER_URL: nats://nats:4222
