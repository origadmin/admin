      contrib.api.security.authz.v1.PolicySpec:
        type: object
        properties:
          type:
            type: string
            description: |-
              Policy type identifier.
               For Casbin: "p" (policy/permission), "g" (grouping/role), "g2", "g3", etc.
               For OPA: "opa:rego"
               For IAM: "iam:statement"
               For Zanzibar: "zanzibar:relation"
          subject:
            type: string
            description: |-
              The subject of this policy (who the policy applies to).
               e.g., "user:123", "role:admin", "service:payment-service"
               NOTE: During authorization checks, this field is ignored and replaced with Principal's identity.
          actions:
            type: array
            items:
              type: string
            description: |-
              Actions that this policy grants or restricts.
               Used for type="p" (permission) policies.
               Multiple actions can be specified (e.g., ["read", "write"] for IAM-style policies).
          resources:
            type: array
            items:
              type: string
            description: |-
              Resources that this policy applies to.
               Used for type="p" (permission) policies.
               Multiple resources can be specified (e.g., ["s3:*", "s3:bucket/*"] for IAM-style policies).
          roles:
            type: array
            items:
              type: string
            description: |-
              Roles that the subject is assigned to.
               Used for type="g" (grouping/role) policies in RBAC.
               Multiple roles can be specified (e.g., ["admin", "editor", "viewer"]).
          effect:
            type: string
            description: |-
              Effect of the policy (e.g., "allow", "deny").
               Recommended values: "allow", "deny"
          domain:
            type: string
            description: |-
              Domain or namespace for this policy.
               Used for multi-tenant isolation (Casbin) or resource namespacing (Zanzibar).
          condition:
            type: string
            description: |-
              Condition expression for the policy.
               Supports multiple formats:
               - Casbin: simple conditions (e.g., "r.sub == p.sub")
               - OPA: Rego code (e.g., "allow { input.user == data.roles.admin }")
               - IAM: JSON conditions (e.g., {"StringEquals": {"aws:UserAgent": "MyApp"}})
          valid_from:
            type: string
            description: Valid from timestamp (Unix epoch in seconds).
          expires_at:
            type: string
            description: Expires at timestamp (Unix epoch in seconds).
          priority:
            type: integer
            description: |-
              Priority of the policy.
               Default is 0 (lowest priority). Higher numbers have higher priority.
            format: int32
          disabled:
            type: boolean
            description: |-
              Whether the policy is disabled.
               Default is false (policy is enabled).
          metadata:
            type: object
            description: |-
              Metadata for framework-specific extensions.
               This field allows arbitrary key-value pairs for framework-specific data.
               Examples:
               - OPA: {"rego_package": "auth", "rego_entrypoint": "allow", "data": {...}}
               - Zanzibar: {"namespace": "document", "object_id": "123", "relation": "viewer"}
               - Custom: any additional fields needed by specific implementations
        description: |-
          PolicySpec is the data transfer object for a complete policy specification.
           Unlike RuleSpec (used for authorization checks without subject),
           PolicySpec includes subject and is used for storage and retrieval.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
    securitySchemes:
        Basic:
            type: http
            scheme: basic
        Bearer:
            type: apiKey
            name: Authorization
            in: header
tags:
  - name: AdminService
    description: |-
      AdminService provides administrative and operational endpoints for identity service.
       These endpoints are intended for system administrators, operators, and for use in testing.
  - name: AdminService
    description: |-
      AdminService provides administrative and operational endpoints.
       Note: This service is a placeholder for future administrative features.
  - name: AuthService
    description: Service AuthService provides APIs for the identity lifecycle.
    - name: DepartmentService
      description: The organization department service definition.
  - name: FileManagerService
    description: The FileManager service definition.
    - name: MeService
      description: Service MeService provides APIs for currently authenticated user to manage their own profile and data.
  - name: NotificationService
    description: "NotificationService provides notification capabilities.\r\n Note: This service is not yet implemented, proto definitions are prepared for future use."
  - name: ObjectStoreService
    description: "The ObjectStore service definition.\r\n This service provides a generic interface for object storage.\r\n While HTTP bindings are provided for flexibility and internal use,\r\n it's primarily designed to be consumed by other backend services like FileManager."
    - name: PermissionService
      description: The login service definition.
  - name: PolicyQueryService
    description: "PolicyQueryService provides read access to authorization policies from casbin_rule table.\r\n This service is consumed by other modules (like auth) to query policy data."
    - name: PositionService
      description: The organization position service definition.
    - name: ResourceService
      description: |-
        The resource service definition.
         A Resource represents a backend asset that requires access control, such as an HTTP API or a gRPC method.
         The definition of the Resource message in types/system.proto should be updated to include fields
         like service_name, path, method, operation, policy, version_id, last_sync_version_id, and sync_status
         as specified in 09_Data_Model_Schema.md.
    - name: RoleService
      description: The login service definition.
    - name: UserService
      description: The login service definition.
    - name: ViewService
      description: "The view service definition.\r\n A View represents a UI element that can be controlled by permissions, such as a menu, button, or page."
