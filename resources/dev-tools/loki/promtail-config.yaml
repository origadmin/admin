server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [ '__meta_docker_container_name' ]
        regex: '/(.*?)(-\\d+)?$'
        target_label: 'container_name'
      - source_labels: [ '__meta_docker_container_log_stream' ]
        target_label: 'logstream'
      - source_labels: [ '__meta_docker_container_label_com_origadmin_logging_jobname' ]
        regex: '(.+)'
        target_label: 'job'
        replacement: '$1'
      - source_labels: [ '__meta_docker_container_label_com_origadmin_service_name' ]
        regex: '(.+)'
        target_label: 'service'
        replacement: '$1'
      - source_labels: [ '__meta_docker_container_label_com_origadmin_service_version' ]
        regex: '(.+)'
        target_label: 'service_version'
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            msg: msg
            service_name: service.name
            service_version: service.version
            service_id: service.id
            caller: caller
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          service:
          service_version:
          trace_id:
      - timestamp:
          source: ts
          format: RFC3339Nano
