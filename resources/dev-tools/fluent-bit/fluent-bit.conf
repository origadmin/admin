[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               kube.*
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval   5

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token

[FILTER]
    Name                modify
    Match               *
    # 添加通用字段
    Add                 env production
    Add                 cluster origadmin

# 解析 JSON 格式的日志
[FILTER]
    Name                parser
    Match               *
    Key_Name            log
    Parser              json
    Reserve_Data        On

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    Index               origadmin-logs
    HTTP_User           admin
    HTTP_Passwd         admin
    tls                 Off

# 可选:同时输出到控制台用于调试
#[OUTPUT]
#    Name                stdout
#    Match               *
