filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

      # 提取容器标签
      - decode_json_fields:
          fields: [ "message" ]
          target: "json"
          overwrite_keys: true

output.logstash:
  hosts: [ "logstash:5044" ]

# 日志级别
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# 监控
monitoring.enabled: false
