input {
  beats {
    port => 5044
  }
}

filter {
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # 解析 JSON 格式的日志
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "json_parsed"
      remove_field => ["message"]
    }
  }

  # 添加时间戳
  date {
    match => ["ts", "ISO8601", "RFC3339"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "origadmin-%{+YYYY.MM.dd}"
  }

  # 可选:输出到控制台用于调试
  stdout {
    codec => rubydebug
  }
}
