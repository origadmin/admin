clients:
  configs:
    - name: "origadmin.service.identity.client.grpc"
      grpc:
        endpoint: "discovery:///origadmin.service.identity"
        timeout: 5s
        discovery_name: "default_consul"
        middlewares:
          - "propagation"
    - name: "origadmin.service.system.client.grpc"
      grpc:
        endpoint: "discovery:///origadmin.service.system"
        timeout: 5s
        discovery_name: "default_consul"
        middlewares:
          - "propagation"
    - name: "origadmin.service.filemanager.client.grpc"
      grpc:
        endpoint: "discovery:///origadmin.service.filemanager"
        timeout: 5s
        discovery_name: "default_consul"
        middlewares:
          - "propagation"
