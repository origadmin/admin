servers:
  configs:
    # Gateway Service HTTP Server
    - name: "gateway"
      protocol: "http"
      http:
        addr: "0.0.0.0:8000"
        timeout: 5s
        cors:
          allowed_origins:
            - "*"
          allowed_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "OPTIONS"
          allowed_headers:
            - "*"
          allow_credentials: true
        middlewares:
          - "authn"

    # Auth Service gRPC Server
    - name: "auth"
      protocol: "grpc"
      grpc:
        addr: "0.0.0.0:9081"
        timeout: 5s
        middlewares:
          - "authz"
    - name: "auth"
      protocol: "http"
      http:
        addr: "0.0.0.0:9082"
        timeout: 5s
        middlewares:
          - "authz"
    # System Service gRPC Server
    - name: "system"
      protocol: "grpc"
      grpc:
        addr: "0.0.0.0:9001"
        timeout: 5s
        # Apply middlewares by name. These names must correspond to entries
        # in the middlewares.yaml configuration file.
        middlewares:
          - "authz"
    # System Service HTTP Server
    - name: "system"
      protocol: "http"
      http:
        addr: "0.0.0.0:9002"
        timeout: 5s
        # Apply middlewares by name.
        middlewares:
          - "authz"
