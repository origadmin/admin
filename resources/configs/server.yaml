servers:
  configs:
    # Gateway Service HTTP Server
    - name: "gateway"
      protocol: "http"
      http:
        addr: "0.0.0.0:8000"
        timeout: 5s
        cors:
          allowed_origins:
            - "*"
          allowed_methods:
            - "GET"
            - "POST"
            - "PUT"
            - "DELETE"
            - "OPTIONS"
          allowed_headers:
            - "*"
          allow_credentials: true
        middlewares:
          - recovery
          #          - tracing
          - logging
          - authn


    # System Service gRPC Server
    - name: "system"
      protocol: "grpc"
      grpc:
        addr: "0.0.0.0:18001"
        timeout: 5s
        # Apply middlewares by name. These names must correspond to entries
        # in the middlewares.yaml configuration file.
        middlewares:
          - "recovery"
          - "authz"
    # System Service HTTP Server
    - name: "system"
      protocol: "http"
      http:
        addr: "0.0.0.0:18002"
        timeout: 5s
        # Apply middlewares by name.
        middlewares:
          - "recovery"
          - "authz"
    # Auth Service Watermill Server (for event consumption)
    - name: "system"
      protocol: "watermill"
      watermill:
        broker:
          type: "nats"
          nats:
            address: "nats://localhost:4222"  # 使用容器网络名称
            jetstream_enabled: true
            jetstream_stream_name: "system_events"
            # 添加连接超时配置
            connect_timeout: 15s
            reconnect_wait: 2s
            max_reconnects: 10
    # Auth Service gRPC Server
    - name: "identity"
      protocol: "grpc"
      grpc:
        addr: "0.0.0.0:18011"
        timeout: 5s
        middlewares:
          - "recovery"
          - "authz"
    - name: "identity"
      protocol: "http"
      http:
        addr: "0.0.0.0:18012"
        timeout: 5s
        middlewares:
          - "recovery"
          - "authz"
    - name: "filemanager"
      protocol: "grpc"
      grpc:
        addr: "0.0.0.0:18021"
        timeout: 5s
        # Apply middlewares by name. These names must correspond to entries
        # in the middlewares.yaml configuration file.
        middlewares:
          - "recovery"
          - "propagation"
    #          - "authz"
    # System Service HTTP Server
    - name: "filemanager"
      protocol: "http"
      http:
        addr: "0.0.0.0:18022"
        timeout: 5s
        # Apply middlewares by name.
        middlewares:
          - "recovery"
          - "propagation"
#          - "authz"
