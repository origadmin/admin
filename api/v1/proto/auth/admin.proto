syntax = "proto3";

package api.v1.services.auth;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/auth;auth";

// AdminService provides administrative and operational endpoints for the auth service.
// These endpoints are intended for system administrators, operators, and for use in testing.
service AdminService {
  // ForcePolicySync triggers an immediate, full synchronization of all authorization policies.
  // This bypasses any debouncing or scheduled syncs and is a high-risk operation.
  rpc ForcePolicySync(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/auth/admin/sync"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }

  // GetPolicySyncStatus retrieves the current status and metrics of the policy synchronization service.
  rpc GetPolicySyncStatus(google.protobuf.Empty) returns (PolicySyncStatusResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/admin/sync/status"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }

  // GetEnforcerPolicies retrieves all policy rules currently loaded into the Casbin Enforcer's memory.
  // This is primarily for debugging and auditing purposes.
  rpc GetEnforcerPolicies(google.protobuf.Empty) returns (EnforcerPoliciesResponse) {
    option (google.api.http) = {
      get: "/api/v1/auth/admin/enforcer/policies"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }
}

// PolicySyncStatusResponse contains the status and metrics of the policy synchronization service.
message PolicySyncStatusResponse {
  bool sync_pending = 1 [json_name = "sync_pending"];
  google.protobuf.Timestamp last_sync_time = 2 [json_name = "last_sync_time"];
  int64 last_sync_duration = 3 [json_name = "last_sync_duration"];
  int64 total_events = 4 [json_name = "total_events"];
  int64 successful_syncs = 5 [json_name = "successful_syncs"];
  int64 failed_syncs = 6 [json_name = "failed_syncs"];
  int64 duplicate_events = 7 [json_name = "duplicate_events"];
  double failure_rate = 8 [json_name = "failure_rate"];
}

// CasbinRule represents a single policy rule (p-rule or g-rule) from the Casbin Enforcer.
message CasbinRule {
  string ptype = 1 [json_name = "ptype"];
  repeated string v = 2 [json_name = "v"];
}

// EnforcerPoliciesResponse contains all policy rules loaded into the Casbin Enforcer's memory.
message EnforcerPoliciesResponse {
  repeated CasbinRule policies = 1 [json_name = "policies"];
}
