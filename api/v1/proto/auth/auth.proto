syntax = "proto3";

package api.v1.services.auth;

import "google/api/annotations.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/auth;auth";
option java_multiple_files = true;
option java_outer_classname = "APIServiceAuthProto";
option java_package = "com.origadmin.api.v1.services.auth";

// Service AuthService provides APIs for the authentication lifecycle.
service AuthService {
  // --- Authentication ---

  // Login authenticates a user and returns a token pair.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/auth/login"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "public"};
  }

  // Register creates a new user account.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/auth/register"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "public"};
  }

  // Logout invalidates the user's session.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/auth/logout"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }

  // RefreshToken provides a new access token.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/auth/refresh"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "public"};
  }

  // --- Captcha ---

  // GetCaptcha generates a new captcha.
  rpc GetCaptcha(GetCaptchaRequest) returns (GetCaptchaResponse) {
    option (google.api.http) = {get: "/auth/captcha"};
    option (contrib.api.policy.v1.policy) = {name: "public"};
  }

  // --- Internal ---

  // Authenticate is for internal use by the gateway to verify user access via gRPC.
  // It does not have an HTTP binding.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
}

// --- Message Definitions ---

// The request message for the Login RPC.
message LoginRequest {
  string username = 1 [json_name = "username"];
  string password = 2 [json_name = "password"];
  string captcha_id = 3 [json_name = "captcha_id"];
  string captcha_code = 4 [json_name = "captcha_code"];
}

// The response message for the Login RPC.
message LoginResponse {
  string access_token = 1 [json_name = "access_token"];
  string refresh_token = 2 [json_name = "refresh_token"];
  string token_type = 3 [json_name = "token_type"];
  int64 expires_in = 4 [json_name = "expires_in"];
}

// The request message for the Register RPC.
message RegisterRequest {
  string username = 1 [json_name = "username"];
  string password = 2 [json_name = "password"];
  string email = 3 [json_name = "email"];
  string captcha_id = 4 [json_name = "captcha_id"];
  string captcha_code = 5 [json_name = "captcha_code"];
}

// The response message for the Register RPC.
message RegisterResponse {}

// The request message for the Logout RPC.
message LogoutRequest {
  string refresh_token = 1 [json_name = "refresh_token"];
}

// The response message for the Logout RPC.
message LogoutResponse {}

// The request message for the RefreshToken RPC.
message RefreshTokenRequest {
  string refresh_token = 1 [json_name = "refresh_token"];
}

// The response message for the RefreshToken RPC.
message RefreshTokenResponse {
  string access_token = 1 [json_name = "access_token"];
  string refresh_token = 2 [json_name = "refresh_token"];
  string token_type = 3 [json_name = "token_type"];
  int64 expires_in = 4 [json_name = "expires_in"];
}

// The request message for the GetCaptcha RPC.
message GetCaptchaRequest {
  // The ID of an existing captcha, used for refreshing or getting audio.
  string captcha_id = 1 [json_name = "captcha_id"];
  // The type of captcha to generate (e.g., "digit", "string", "math", "chinese", "audio").
  string captcha_type = 2 [json_name = "captcha_type"];
}

// The response message for the GetCaptcha RPC.
message GetCaptchaResponse {
  // The unique identifier for the generated captcha.
  string captcha_id = 1 [json_name = "captcha_id"];
  // Base64 encoded data of the captcha (image or audio).
  string captcha_data = 2 [json_name = "captcha_data"];
  // The MIME type of the captcha data (e.g., "image/png", "audio/wav").
  string mime_type = 3 [json_name = "mime_type"];
}

// The request message for the Authenticate RPC.
message AuthenticateRequest {
  string token = 1 [json_name = "token"];
  string path = 2 [json_name = "path"];
  string method = 3 [json_name = "method"];
}

// The response message for the Authenticate RPC.
message AuthenticateResponse {
  bool authorized = 1 [json_name = "authorized"];
  string user_id = 2 [json_name = "user_id"];
}
