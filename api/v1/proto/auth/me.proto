syntax = "proto3";

package api.v1.services.auth;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "types/system.proto";

option go_package = "origadmin/application/admin/api/v1/services/auth;auth";
option java_multiple_files = true;
option java_package = "com.origadmin.api.v1.services.auth";
option java_outer_classname = "APIServiceMeProto";

// Service Me provides APIs for the currently authenticated user to manage their own profile and data.
service Me {
  // GetProfile retrieves the profile of the currently authenticated user.
  rpc GetProfile(GetProfileRequest) returns (api.v1.services.types.User) {
    option (google.api.http) = {
      get: "/api/v1/me/profile"
    };
  }

  // UpdateProfile updates the profile of the currently authenticated user.
  rpc UpdateProfile(UpdateProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/me/profile"
      body: "*"
    };
  }

  // UpdatePassword changes the password for the currently authenticated user.
  rpc UpdatePassword(UpdatePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/me/password"
      body: "*"
    };
  }

  // GetUserResources retrieves the menu/resource list for the current user.
  rpc GetUserResources(GetUserResourcesRequest) returns (GetUserResourcesResponse) {
    option (google.api.http) = {
      get: "/api/v1/me/resources"
    };
  }

  // GetUserRoles retrieves the role list for the current user.
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse) {
    option (google.api.http) = {
      get: "/api/v1/me/roles"
    };
  }
}

// The request message for the GetProfile RPC.
message GetProfileRequest {}

// The request message for the UpdateProfile RPC.
message UpdateProfileRequest {
  // The fields to update.
  api.v1.services.types.User user = 1;
}

// The request message for the UpdatePassword RPC.
message UpdatePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// The request message for the GetUserResources RPC.
message GetUserResourcesRequest {}

// The response message for the GetUserResources RPC.
message GetUserResourcesResponse {
  repeated api.v1.services.types.Resource resources = 1;
}

// The request message for the GetUserRoles RPC.
message GetUserRolesRequest {}

// The response message for the GetUserRoles RPC.
message GetUserRolesResponse {
  repeated api.v1.services.types.Role roles = 1;
}
