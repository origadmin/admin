syntax = "proto3";

package api.v1.services.objectstore;

import "google/api/annotations.proto";
import "types/objectstore.proto";

option go_package = "origadmin/application/admin/api/v1/services/objectstore;objectstore";
option java_multiple_files = true;
option java_outer_classname = "APIServiceObjectStoreProto";
option java_package = "com.origadmin.api.v1.services.objectstore";

// The ObjectStore service definition.
// This service provides a generic interface for object storage.
// While HTTP bindings are provided for flexibility and internal use,
// it's primarily designed to be consumed by other backend services like FileManager.
service ObjectStoreService {
  // Uploads an object in a single request. Suitable for small files.
  rpc UploadObject(UploadObjectRequest) returns (UploadObjectResponse) {
    option (google.api.http) = {
      post: "/obs/objects"
      body: "*"
    };
  }

  // Downloads an object.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse) {
    option (google.api.http) = {
      get: "/obs/objects/{id}"
    };
  }

  // Deletes an object.
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse) {
    option (google.api.http) = {
      delete: "/obs/objects/{id}"
    };
  }

  // Initiates a multipart upload and returns an upload ID.
  rpc InitiateMultipartUpload(InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse) {
    option (google.api.http) = {
      post: "/obs/objects/multipart"
      body: "*"
    };
  }

  // Generates a presigned URL for uploading a part.
  rpc GetMultipartUploadUrl(GetMultipartUploadUrlRequest) returns (GetMultipartUploadUrlResponse) {
    option (google.api.http) = {
      get: "/obs/objects/multipart/{object_id}/uploads/{upload_id}/parts/{part_number}"
    };
  }

  // Lists the parts that have been uploaded for a specific multipart upload.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse) {
    option (google.api.http) = {
      get: "/obs/objects/multipart/{object_id}/uploads/{upload_id}/parts"
    };
  }

  // Completes a multipart upload.
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse) {
    option (google.api.http) = {
      post: "/obs/objects/multipart/{object_id}/uploads/{upload_id}:complete"
      body: "*"
    };
  }

  // Aborts a multipart upload.
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse) {
    option (google.api.http) = {
      delete: "/obs/objects/multipart/{object_id}/uploads/{upload_id}"
    };
  }
}

// Request message for initiating a multipart upload.
message InitiateMultipartUploadRequest {
  string name = 1;
  string content_type = 2;
}

// Response message for initiating a multipart upload.
message InitiateMultipartUploadResponse {
  string upload_id = 1;
  string object_id = 2; // The final object ID/key in the storage.
}

// Request message for getting a multipart upload URL.
message GetMultipartUploadUrlRequest {
  string upload_id = 1;
  string object_id = 2;
  int32 part_number = 3;
}

// Response message for getting a multipart upload URL.
message GetMultipartUploadUrlResponse {
  string upload_url = 1;
}

// Request message for listing uploaded parts.
message ListPartsRequest {
  string upload_id = 1;
  string object_id = 2;
}

// Response message for listing uploaded parts.
message ListPartsResponse {
  repeated api.v1.services.types.PartInfo parts = 1;
}

// Request message for completing a multipart upload.
message CompleteMultipartUploadRequest {
  string upload_id = 1;
  string object_id = 2;
  repeated api.v1.services.types.PartInfo parts = 3;
}

// Response message for completing a multipart upload.
message CompleteMultipartUploadResponse {
  api.v1.services.types.Object object = 1;
}

// Request message for aborting a multipart upload.
message AbortMultipartUploadRequest {
  string upload_id = 1;
  string object_id = 2;
}

// Response message for aborting a multipart upload.
message AbortMultipartUploadResponse {}

// Request message for uploading an object in a single request.
message UploadObjectRequest {
  bytes data = 1;
  string name = 2;
  string content_type = 3;
}

// Response message for uploading an object.
message UploadObjectResponse {
  api.v1.services.types.Object object = 1;
}

// Request message for getting an object.
message GetObjectRequest {
  string id = 1;
}

// Response message for getting an object.
message GetObjectResponse {
  api.v1.services.types.Object object = 1;
}

// Request message for deleting an object.
message DeleteObjectRequest {
  string id = 1;
}

// Response message for deleting an object.
message DeleteObjectResponse {}
