syntax = "proto3";

package api.v1.services.filemanager;

import "google/api/annotations.proto";
import "policy/v1/policy.proto";
import "types/filemanager.proto";

option go_package = "origadmin/application/admin/api/v1/services/filemanager;filemanager";
option java_multiple_files = true;
option java_outer_classname = "APIServiceFileManagerProto";
option java_package = "com.origadmin.api.v1.services.filemanager";

// The FileManager service definition.
service FileManagerService {
  // Simple upload for small files (e.g. avatars, images).
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {
    option (google.api.http) = {
      post: "/fm/files"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Initiates a multipart upload for large files.
  rpc InitiateMultipartUpload(InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse) {
    option (google.api.http) = {
      post: "/fm/files/multipart"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Gets a presigned URL for a specific part of a multipart upload.
  rpc GetMultipartUploadUrl(GetMultipartUploadUrlRequest) returns (GetMultipartUploadUrlResponse) {
    option (google.api.http) = {
      get: "/fm/files/multipart/{upload_id}/parts/{part_number}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Completes a multipart upload.
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse) {
    option (google.api.http) = {
      post: "/fm/files/multipart/{upload_id}/complete"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Aborts a multipart upload.
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse) {
    option (google.api.http) = {
      delete: "/fm/files/multipart/{upload_id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Gets file metadata.
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option (google.api.http) = {
      get: "/fm/files/{id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Lists files with pagination and filtering.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {
      get: "/fm/files"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Updates file metadata.
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse) {
    option (google.api.http) = {
      put: "/fm/files/{id}"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // Deletes a file and its metadata.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = {
      delete: "/fm/files/{id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
}

// Request message for uploading a small file directly.
message UploadFileRequest {
  bytes data = 1;
  string name = 2;
  string content_type = 3;
  string visibility = 4; // "public" or "private"
}

// Response message for uploading a file.
message UploadFileResponse {
  api.v1.services.types.FileMetadata file_metadata = 1;
}

// Request message for initiating a multipart upload.
message InitiateMultipartUploadRequest {
  string name = 1;
  int64 size = 2;
  string content_type = 3;
  string visibility = 4; // "public" or "private"
}

// Response message for initiating a multipart upload.
message InitiateMultipartUploadResponse {
  string upload_id = 1;
}

// Request message for getting a multipart upload URL.
message GetMultipartUploadUrlRequest {
  string upload_id = 1;
  int32 part_number = 2;
}

// Response message for getting a multipart upload URL.
message GetMultipartUploadUrlResponse {
  string upload_url = 1;
}

// Request message for completing a multipart upload.
message CompleteMultipartUploadRequest {
  string upload_id = 1;
  repeated PartInfo parts = 2;
}

message PartInfo {
  int32 part_number = 1;
  string etag = 2;
}

// Response message for completing a multipart upload.
message CompleteMultipartUploadResponse {
  api.v1.services.types.FileMetadata file_metadata = 1;
}

// Request message for aborting a multipart upload.
message AbortMultipartUploadRequest {
  string upload_id = 1;
}

// Response message for aborting a multipart upload.
message AbortMultipartUploadResponse {}

// Request message for getting file metadata.
message GetFileRequest {
  int64 id = 1;
}

// Response message for getting file metadata.
message GetFileResponse {
  api.v1.services.types.FileMetadata file_metadata = 1;
  string download_url = 2; // Presigned URL or public URL
}

// Request message for listing files.
message ListFilesRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 owner_id = 3;
  string visibility = 4;
}

// Response message for listing files.
message ListFilesResponse {
  repeated api.v1.services.types.FileMetadata files = 1;
  int32 total_count = 2;
}

// Request message for updating file metadata.
message UpdateFileRequest {
  int64 id = 1;
  string name = 2;
  string visibility = 3;
}

// Response message for updating file metadata.
message UpdateFileResponse {
  api.v1.services.types.FileMetadata file_metadata = 1;
}

// Request message for deleting a file.
message DeleteFileRequest {
  int64 id = 1;
}

// Response message for deleting a file.
message DeleteFileResponse {}
