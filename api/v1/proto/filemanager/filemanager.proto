syntax = "proto3";

package api.v1.services.filemanager;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "policy/v1/policy.proto";
import "types/filemanager.proto";

option go_package = "origadmin/application/admin/api/v1/services/filemanager;filemanager";
option java_multiple_files = true;
option java_outer_classname = "APIServiceFileManagerProto";
option java_package = "com.origadmin.api.v1.services.filemanager";

service FileManagerService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {
    option (google.api.http) = {post: "/fm/files"; body: "*"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc InitiateMultipartUpload(InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse) {
    option (google.api.http) = {post: "/fm/files/multipart"; body: "*"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc GetMultipartUploadUrl(GetMultipartUploadUrlRequest) returns (GetMultipartUploadUrlResponse) {
    option (google.api.http) = {get: "/fm/files/multipart/{upload_id}/parts/{part_number}"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse) {
    option (google.api.http) = {post: "/fm/files/multipart/{upload_id}/complete"; body: "*"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse) {
    option (google.api.http) = {delete: "/fm/files/multipart/{upload_id}"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option (google.api.http) = {get: "/fm/files/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {get: "/fm/files"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse) {
    option (google.api.http) = {put: "/fm/files/{id}"; body: "*"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = {delete: "/fm/files/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
}

message UploadFileRequest {
  bytes data = 1 [json_name = "data"];
  string name = 2 [json_name = "name"];
  string content_type = 3 [json_name = "content_type"];
  string visibility = 4 [json_name = "visibility"];
}

message UploadFileResponse {
  api.v1.services.types.FileMetadata file_metadata = 1 [json_name = "file_metadata"];
}

message InitiateMultipartUploadRequest {
  string name = 1 [json_name = "name"];
  int64 size = 2 [json_name = "size"];
  string content_type = 3 [json_name = "content_type"];
  string visibility = 4 [json_name = "visibility"];
}

message InitiateMultipartUploadResponse {
  string upload_id = 1 [json_name = "upload_id"];
}

message GetMultipartUploadUrlRequest {
  string upload_id = 1 [json_name = "upload_id"];
  int32 part_number = 2 [json_name = "part_number"];
}

message GetMultipartUploadUrlResponse {
  string upload_url = 1 [json_name = "upload_url"];
}

message CompleteMultipartUploadRequest {
  string upload_id = 1 [json_name = "upload_id"];
  repeated PartInfo parts = 2 [json_name = "parts"];
  string sha256 = 3 [json_name = "sha256"]; // ADDED: For end-to-end verification
}

message PartInfo {
  int32 part_number = 1 [json_name = "part_number"];
  string etag = 2 [json_name = "etag"];
}

message CompleteMultipartUploadResponse {
  api.v1.services.types.FileMetadata file_metadata = 1 [json_name = "file_metadata"];
}

message AbortMultipartUploadRequest {string upload_id = 1 [json_name = "upload_id"];}
message AbortMultipartUploadResponse {}

message GetFileRequest {int64 id = 1 [json_name = "id"];}
message GetFileResponse {
  api.v1.services.types.FileMetadata file_metadata = 1 [json_name = "file_metadata"];
  string download_url = 2 [json_name = "download_url"];
}

message ListFilesRequest {
  int32 page = 1 [json_name = "page"];
  int32 page_size = 2 [json_name = "page_size"];
  string page_token = 3 [json_name = "page_token"];
  optional string paging_mode = 4 [json_name = "paging_mode"];
  bool only_count = 5 [json_name = "only_count"];
  string keyword = 6 [json_name = "keyword"];
  int64 owner_id = 7 [json_name = "owner_id"];
  string visibility = 8 [json_name = "visibility"];
}

message ListFilesResponse {
  int32 total = 1 [json_name = "total"];
  repeated api.v1.services.types.FileMetadata files = 2 [json_name = "files"];
  int32 page = 3 [json_name = "page"];
  int32 page_size = 4 [json_name = "page_size"];
  string next_page_token = 5 [json_name = "next_page_token"];
  optional google.protobuf.Any extra = 6 [json_name = "extra"];
}

message UpdateFileRequest {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string visibility = 3 [json_name = "visibility"];
}

message UpdateFileResponse {api.v1.services.types.FileMetadata file_metadata = 1 [json_name = "file_metadata"];}
message DeleteFileRequest {int64 id = 1 [json_name = "id"];}
message DeleteFileResponse {}
