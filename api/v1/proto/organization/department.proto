syntax = "proto3";

package api.v1.services.organization;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "types/organization.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/organization;organization";
option java_multiple_files = true;
option java_outer_classname = "APIServiceOrganizationDepartmentProto";
option java_package = "com.origadmin.api.v1.services.organization";
option objc_class_prefix = "APIServiceOrganizationDepartment";

// The organization department service definition.
service DepartmentService {
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse) {
    option (google.api.http) = {get: "/org/departments"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
  rpc GetDepartment(GetDepartmentRequest) returns (GetDepartmentResponse) {
    option (google.api.http) = {get: "/org/departments/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse) {
    option (google.api.http) = {
      post: "/org/departments"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (UpdateDepartmentResponse) {
    option (google.api.http) = {
      put: "/org/departments/{department.id}"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse) {
    option (google.api.http) = {delete: "/org/departments/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
}

message ListDepartmentsRequest {
  // The page number.
  int32 page = 1 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 2 [json_name = "page_size"];
  // The next_page_token value returned from a previous List request, if any.
  string page_token = 3 [json_name = "page_token"];
  // The paging_mode is used to specify the pagination mode.
  optional string paging_mode = 4 [json_name = "paging_mode"];
  // The only_count is the query parameter for set only to query the total number
  bool only_count = 5 [json_name = "only_count"];
  // The keyword is the query parameter for set only to query the department by keyword
  string keyword = 6 [json_name = "keyword"];
}

message ListDepartmentsResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The paging departments
  repeated api.v1.services.types.Department departments = 2 [json_name = "departments"];
  // The page number.
  int32 page = 3 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 4 [json_name = "page_size"];
  // Token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 5 [json_name = "next_page_token"];
  // Additional information about this response.
  // content to be added without destroying the page data format
  optional google.protobuf.Any extra = 6 [json_name = "extra"];
}

message GetDepartmentRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
}

message GetDepartmentResponse {
  api.v1.services.types.Department department = 1 [json_name = "department"];
}

message CreateDepartmentRequest {
  // The department resource to create.
  api.v1.services.types.Department department = 1 [json_name = "department"];
}

message CreateDepartmentResponse {
  api.v1.services.types.Department department = 1 [json_name = "department"];
}

message UpdateDepartmentRequest {
  // The department resource which replaces the resource on the server.
  api.v1.services.types.Department department = 1 [json_name = "department"];
}

message UpdateDepartmentResponse {
  api.v1.services.types.Department department = 1 [json_name = "department"];
}

message DeleteDepartmentRequest {
  // The resource id of the department to be deleted.
  int64 id = 1 [json_name = "id"];
}

message DeleteDepartmentResponse {
  google.protobuf.Empty empty = 1;
}
