syntax = "proto3";

package api.v1.services.identity;

import "google/api/annotations.proto";
import "policy/v1/policy.proto";
import "types/system.proto";

option go_package = "origadmin/application/admin/api/v1/services/identity;identity";
option java_multiple_files = true;
option java_package = "com.origadmin.api.v1.services.identity";
option java_outer_classname = "APIServiceMeProto";

// Service MeService provides APIs for currently authenticated user to manage their own profile and data.
service MeService {
  // ListMyViews retrieves entire view tree available to currently authenticated user.
  rpc ListMyViews(ListMyViewsRequest) returns (ListMyViewsResponse) {
    option (google.api.http) = {
      get: "/me/views"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // GetProfile retrieves profile of currently authenticated user.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = {
      get: "/me/profile"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // UpdateProfile updates profile of currently authenticated user.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/me/profile"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // UpdatePassword changes password for currently authenticated user.
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse) {
    option (google.api.http) = {
      put: "/me/password"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // GetUserResources retrieves menu/resource list for current user.
  rpc GetUserResources(GetUserResourcesRequest) returns (GetUserResourcesResponse) {
    option (google.api.http) = {
      get: "/me/resources"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // GetUserRoles retrieves role list for current user.
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse) {
    option (google.api.http) = {
      get: "/me/roles"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // GetUserSettings retrieves user settings (P2).
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse) {
    option (google.api.http) = {
      get: "/me/settings"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // UpdateSettings updates user settings (P2).
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (google.api.http) = {
      put: "/me/settings"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // GetUserPreferences retrieves user preferences (P2).
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse) {
    option (google.api.http) = {
      get: "/me/preferences"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }

  // UpdatePreferences updates user preferences (P2).
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse) {
    option (google.api.http) = {
      put: "/me/preferences"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authn"};
  }
}

// The request message for the ListMyViews RPC. It is empty as we fetch all views.
message ListMyViewsRequest {}

// The response message for the ListMyViews RPC.
message ListMyViewsResponse {
  repeated api.v1.services.types.View views = 1;
}

// The request message for the GetProfile RPC.
message GetProfileRequest {}

// The response message for the GetProfile RPC.
message GetProfileResponse {
  api.v1.services.types.UserProfile profile = 1;
}

// The request message for the UpdateProfile RPC.
message UpdateProfileRequest {
  // The fields to update.
  api.v1.services.types.UserProfile profile = 1;
}

// The response message for the UpdateProfile RPC.
message UpdateProfileResponse {}

// The request message for the UpdatePassword RPC.
message UpdatePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// The response message for the UpdatePassword RPC.
message UpdatePasswordResponse {}

// The request message for the GetUserResources RPC.
message GetUserResourcesRequest {}

// The response message for the GetUserResources RPC.
message GetUserResourcesResponse {
  repeated api.v1.services.types.Resource resources = 1;
}

// The request message for the GetUserRoles RPC.
message GetUserRolesRequest {}

// The response message for the GetUserRoles RPC.
message GetUserRolesResponse {
  repeated api.v1.services.types.Role roles = 1;
}

// The request message for the GetUserSettings RPC (P2).
message GetUserSettingsRequest {}

// The response message for the GetUserSettings RPC (P2).
message GetUserSettingsResponse {
  api.v1.services.types.UserSetting setting = 1;
}

// The request message for the UpdateSettings RPC (P2).
message UpdateSettingsRequest {
  api.v1.services.types.UserSetting setting = 1;
}

// The response message for the UpdateSettings RPC (P2).
message UpdateSettingsResponse {}

// The request message for the GetUserPreferences RPC (P2).
message GetUserPreferencesRequest {}

// The response message for the GetUserPreferences RPC (P2).
message GetUserPreferencesResponse {
  map<string, string> preferences = 1;
}

// The request message for the UpdatePreferences RPC (P2).
message UpdatePreferencesRequest {
  map<string, string> preferences = 1;
}

// The response message for the UpdatePreferences RPC (P2).
message UpdatePreferencesResponse {}
