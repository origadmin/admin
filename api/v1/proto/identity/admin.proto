syntax = "proto3";

package api.v1.services.identity;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/identity;identity";
option java_multiple_files = true;
option java_outer_classname = "APIServiceIdentityAdminProto";
option java_package = "com.origadmin.api.v1.services.identity";

// AdminService provides administrative and operational endpoints for identity service.
// These endpoints are intended for system administrators, operators, and for use in testing.
service AdminService {
  // ForcePolicySync triggers an immediate, full synchronization of all authorization policies.
  // This bypasses any debouncing or scheduled syncs and is a high-risk operation.
  rpc ForcePolicySync(ForcePolicySyncRequest) returns (ForcePolicySyncResponse) {
    option (google.api.http) = {
      post: "/auth/admin/sync"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }

  // GetPolicySyncStatus retrieves current status and metrics of policy synchronization service.
  rpc GetPolicySyncStatus(GetPolicySyncStatusRequest) returns (GetPolicySyncStatusResponse) {
    option (google.api.http) = {
      get: "/auth/admin/sync/status"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }

  // GetEnforcerPolicies retrieves all policy rules currently loaded into Casbin Enforcer's memory.
  // This is primarily for debugging and auditing purposes.
  rpc GetEnforcerPolicies(GetEnforcerPoliciesRequest) returns (GetEnforcerPoliciesResponse) {
    option (google.api.http) = {
      get: "/auth/admin/enforcer/policies"
    };
    option (contrib.api.policy.v1.policy) = {
      name: "admin"
    };
  }
}

// ForcePolicySyncRequest is the request for AdminService.ForcePolicySync.
message ForcePolicySyncRequest {}

// ForcePolicySyncResponse is the response for AdminService.ForcePolicySync.
message ForcePolicySyncResponse {}

// GetPolicySyncStatusRequest is the request for AdminService.GetPolicySyncStatus.
message GetPolicySyncStatusRequest {}

// GetPolicySyncStatusResponse contains status and metrics of policy synchronization service.
message GetPolicySyncStatusResponse {
  bool sync_pending = 1 [json_name = "sync_pending"];
  google.protobuf.Timestamp last_sync_time = 2 [json_name = "last_sync_time"];
  int64 last_sync_duration = 3 [json_name = "last_sync_duration"];
  int64 total_events = 4 [json_name = "total_events"];
  int64 successful_syncs = 5 [json_name = "successful_syncs"];
  int64 failed_syncs = 6 [json_name = "failed_syncs"];
  int64 duplicate_events = 7 [json_name = "duplicate_events"];
  double failure_rate = 8 [json_name = "failure_rate"];
}

// GetEnforcerPoliciesRequest is the request for AdminService.GetEnforcerPolicies.
message GetEnforcerPoliciesRequest {}

// CasbinRule represents a single policy rule (p-rule or g-rule) from Casbin Enforcer.
message CasbinRule {
  string ptype = 1 [json_name = "ptype"];
  repeated string v = 2 [json_name = "v"];
}

// GetEnforcerPoliciesResponse contains all policy rules loaded into Casbin Enforcer's memory.
message GetEnforcerPoliciesResponse {
  repeated CasbinRule policies = 1 [json_name = "policies"];
}
