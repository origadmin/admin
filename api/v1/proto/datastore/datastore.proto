syntax = "proto3";

package api.v1.services.datastore;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "types/datastore.proto";
import "validate/validate.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/datastore;datastore";
option java_multiple_files = true;
option java_outer_classname = "APIV1ServicesDatastoreProto";
option java_package = "com.origadmin.api.v1.services.datastore";

// DatastoreService provides file storage and data management capabilities.
// Note: This service is not yet implemented, proto definitions are prepared for future use.
service DatastoreService {
  // UploadFile uploads a file to the datastore.
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse) {
    option (google.api.http) = {
      post: "/ds/files/upload"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // DownloadFile downloads a file from the datastore.
  rpc DownloadFile(DownloadFileRequest) returns (DownloadFileResponse) {
    option (google.api.http) = {
      get: "/ds/files/{file_id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // ListFiles retrieves a list of files.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {
      get: "/ds/files"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // GetFile retrieves a file by ID.
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option (google.api.http) = {
      get: "/ds/files/{file_id}/info"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // DeleteFile deletes a file from the datastore.
  rpc DeleteFile(DeleteFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/ds/files/{file_id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // CreateDatastore creates a data object.
  rpc CreateDatastore(CreateDatastoreRequest) returns (CreateDatastoreResponse) {
    option (google.api.http) = {
      post: "/ds"
      body: "data"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // GetDatastore retrieves a data object by ID.
  rpc GetDatastore(GetDatastoreRequest) returns (GetDatastoreResponse) {
    option (google.api.http) = {
      get: "/ds/{id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // UpdateDatastore updates a data object.
  rpc UpdateDatastore(UpdateDatastoreRequest) returns (UpdateDatastoreResponse) {
    option (google.api.http) = {
      put: "/ds/{data.id}"
      body: "data"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }

  // DeleteDatastore deletes a data object.
  rpc DeleteDatastore(DeleteDatastoreRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/ds/{id}"
    };
    option (contrib.api.policy.v1.policy) = {name: "authenticated"};
  }
}

// UploadFileRequest is the request for DatastoreService.UploadFile.
message UploadFileRequest {
  // The file name.
  string filename = 1 [json_name = "filename", (validate.rules).string = {min_len: 1}];

  // The file content type (MIME type).
  string content_type = 2 [json_name = "content_type"];

  // The file content as bytes.
  bytes content = 3 [json_name = "content"];

  // The owner ID.
  optional int64 owner_id = 4 [json_name = "owner_id"];

  // Additional metadata.
  map<string, string> metadata = 5 [json_name = "metadata"];
}

// UploadFileResponse is the response for DatastoreService.UploadFile.
message UploadFileResponse {
  // The uploaded file info.
  api.v1.services.types.File file = 1 [json_name = "file"];
}

// DownloadFileRequest is the request for DatastoreService.DownloadFile.
message DownloadFileRequest {
  // The file ID.
  int64 file_id = 1 [json_name = "file_id", (validate.rules).int64 = {gt: 0}];
}

// DownloadFileResponse is the response for DatastoreService.DownloadFile.
message DownloadFileResponse {
  // The file content as bytes.
  bytes content = 1 [json_name = "content"];

  // The file content type.
  string content_type = 2 [json_name = "content_type"];

  // The file name.
  string filename = 3 [json_name = "filename"];
}

// ListFilesRequest is the request for DatastoreService.ListFiles.
message ListFilesRequest {
  // Filter by owner ID.
  optional int64 owner_id = 1 [json_name = "owner_id"];

  // Filter by content type.
  optional string content_type = 2 [json_name = "content_type"];

  // Page number.
  int32 page = 3 [json_name = "page"];

  // Page size.
  int32 page_size = 4 [json_name = "page_size"];
}

// ListFilesResponse is the response for DatastoreService.ListFiles.
message ListFilesResponse {
  // The list of files.
  repeated api.v1.services.types.File files = 1 [json_name = "files"];

  // Total count.
  int32 total = 2 [json_name = "total"];

  // Current page.
  int32 page = 3 [json_name = "page"];

  // Page size.
  int32 page_size = 4 [json_name = "page_size"];
}

// GetFileRequest is the request for DatastoreService.GetFile.
message GetFileRequest {
  // The file ID.
  int64 file_id = 1 [json_name = "file_id", (validate.rules).int64 = {gt: 0}];
}

// GetFileResponse is the response for DatastoreService.GetFile.
message GetFileResponse {
  // The file info.
  api.v1.services.types.File file = 1 [json_name = "file"];
}

// DeleteFileRequest is the request for DatastoreService.DeleteFile.
message DeleteFileRequest {
  // The file ID.
  int64 file_id = 1 [json_name = "file_id", (validate.rules).int64 = {gt: 0}];
}

// CreateDatastoreRequest is the request for DatastoreService.CreateDatastore.
message CreateDatastoreRequest {
  // The data object to create.
  api.v1.services.types.DataObject data = 1 [json_name = "data"];
}

// CreateDatastoreResponse is the response for DatastoreService.CreateDatastore.
message CreateDatastoreResponse {
  // The created data object.
  api.v1.services.types.DataObject data = 1 [json_name = "data"];
}

// GetDatastoreRequest is the request for DatastoreService.GetDatastore.
message GetDatastoreRequest {
  // The data ID.
  string id = 1 [json_name = "id", (validate.rules).string = {min_len: 1}];
}

// GetDatastoreResponse is the response for DatastoreService.GetDatastore.
message GetDatastoreResponse {
  // The data object.
  api.v1.services.types.DataObject data = 1 [json_name = "data"];
}

// UpdateDatastoreRequest is the request for DatastoreService.UpdateDatastore.
message UpdateDatastoreRequest {
  // The ID of the data object to update.
  string id = 1 [json_name = "id", (validate.rules).string = {min_len: 1}];

  // The data object to update.
  api.v1.services.types.DataObject data = 2 [json_name = "data"];
}

// UpdateDatastoreResponse is the response for DatastoreService.UpdateDatastore.
message UpdateDatastoreResponse {
  // The updated data object.
  api.v1.services.types.DataObject data = 1 [json_name = "data"];
}

// DeleteDatastoreRequest is the request for DatastoreService.DeleteDatastore.
message DeleteDatastoreRequest {
  // The ID of the data object to delete.
  string id = 1 [json_name = "id", (validate.rules).string = {min_len: 1}];
}
