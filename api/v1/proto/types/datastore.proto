syntax = "proto3";

package api.v1.services.types;

import "google/protobuf/timestamp.proto";

option go_package = "origadmin/application/admin/api/v1/services/types;types";
option java_multiple_files = true;
option java_outer_classname = "APIServiceTypeDatastoreProto";
option java_package = "com.origadmin.api.v1.services.types";
option objc_class_prefix = "APIServiceType";

// File represents a stored file.
message File {
  // The file ID.
  int64 id = 1 [json_name = "id"];

  // The file name.
  string name = 2 [json_name = "name"];

  // The file URL for download.
  string url = 3 [json_name = "url"];

  // The file content type (MIME type).
  string content_type = 4 [json_name = "content_type"];

  // The file size in bytes.
  int64 size = 5 [json_name = "size"];

  // The storage path.
  string storage_path = 6 [json_name = "storage_path"];

  // The owner user ID.
  int64 created_by = 7 [json_name = "created_by"];

  // The creation time.
  google.protobuf.Timestamp created_at = 8 [json_name = "created_at"];

  // Additional metadata.
  map<string, string> metadata = 9 [json_name = "metadata"];
}

// FileStatus represents the status of a file upload.
enum FileStatus {
  // Unspecified status.
  FILE_STATUS_UNSPECIFIED = 0;
  // File upload is pending.
  FILE_STATUS_PENDING = 1;
  // File upload completed successfully.
  FILE_STATUS_COMPLETED = 2;
  // File upload failed.
  FILE_STATUS_FAILED = 3;
}

// DataObject is the model entity for the DataObject schema.
message DataObject {
  // ID of the ent.
  string id = 1 [json_name = "id"];
  // CreateTime holds the value of the "create_time" field.
  google.protobuf.Timestamp create_time = 2 [json_name = "create_time"];
  // UpdateTime holds the value of the "update_time" field.
  google.protobuf.Timestamp update_time = 3 [json_name = "update_time"];
  // DeleteTime holds the value of the "delete_time" field.
  google.protobuf.Timestamp delete_time = 4 [json_name = "delete_time"];
  // Version holds the value of the "version" field.
  int64 version = 5 [json_name = "version"];
  // OwnerID holds the value of the "owner_id" field.
  string owner_id = 6 [json_name = "owner_id"];
  // Metadata holds the value of the "metadata" field.
  map<string, string> metadata = 7 [json_name = "metadata"];
  // Payload holds the value of the "payload" field.
  bytes payload = 8 [json_name = "payload"];
}
