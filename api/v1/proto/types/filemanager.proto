syntax = "proto3";

package api.v1.services.types;

import "google/protobuf/timestamp.proto";
import "types/objectstore.proto";

option go_package = "origadmin/application/admin/api/v1/services/types;types";
option java_multiple_files = true;
option java_outer_classname = "APIServiceTypeFileManagerProto";
option java_package = "com.origadmin.api.v1.services.types";

// Represents file metadata managed by the filemanager service.
message FileMetadata {
  string id = 1;
  string name = 2;
  string object_id = 3;
  string owner_id = 4;
  google.protobuf.Timestamp created_time = 5 [json_name = "created_time"];
  Object object_info = 6;
}
