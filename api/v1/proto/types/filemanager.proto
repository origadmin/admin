syntax = "proto3";

package api.v1.services.types;

import "google/protobuf/timestamp.proto";
import "types/objectstore.proto";

option go_package = "origadmin/application/admin/api/v1/services/types;types";
option java_multiple_files = true;
option java_outer_classname = "APIServiceTypeFileManagerProto";
option java_package = "com.origadmin.api.v1.services.types";
option objc_class_prefix = "APIServiceType";

// Represents metadata for a file managed by the FileManager.
message FileMetadata {
  int64 id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string object_id = 3 [json_name = "object_id"];
  int64 owner_id = 4 [json_name = "owner_id"];
  string sha256 = 5 [json_name = "sha256"];
  string visibility = 7 [json_name = "visibility"];
  string mime_type = 8 [json_name = "mime_type"];
  int64 size = 9 [json_name = "size"];
  Object object_info = 10 [json_name = "object_info"];
  bool is_permanent = 11 [json_name = "is_permanent"];
  google.protobuf.Timestamp expires_at = 12 [json_name = "expires_at"];
  int32 max_downloads = 13 [json_name = "max_downloads"];
  int32 download_count = 14 [json_name = "download_count"];
  // Matches ent's CreateTime field for automatic DTO mapping
  google.protobuf.Timestamp create_time = 15 [json_name = "create_time"];
  // Matches ent's UpdateTime field for automatic DTO mapping
  google.protobuf.Timestamp update_time = 16 [json_name = "update_time"];
}
