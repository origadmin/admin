syntax = "proto3";

package api.v1.services.system;

import "google/api/annotations.proto";
import "policy/v1/policy.proto";
import "security/authz/v1/authz.proto";

option go_package = "origadmin/application/admin/api/v1/services/system;system";
option java_multiple_files = true;
option java_outer_classname = "APIServicePolicyQueryProto";
option java_package = "com.origadmin.api.v1.services.system";
option objc_class_prefix = "APIServicePolicyQuery";

// PolicyQueryService provides read access to authorization policies from casbin_rule table.
// This service is consumed by other modules (like auth) to query policy data.
service PolicyQueryService {
  // ListPolicies retrieves authorization policies from casbin_rule table.
  // This is the ONLY data source interface for providing policy data to other services.
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (google.api.http) = {
      post: "/sys/policies/list"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
}

// ListPoliciesRequest specifies filter criteria for policy retrieval.
// All fields are optional; omitted fields act as wildcards (match any value).
message ListPoliciesRequest {
  // Filter by policy type (e.g., "p", "g", "opa:rego", "iam:statement")
  optional string type = 1 [json_name = "type"];

  // Filter by subject (e.g., "user:123", "role:admin")
  optional string subject = 2 [json_name = "subject"];

  // Filter by actions (e.g., ["read", "write"])
  repeated string actions = 3 [json_name = "actions"];

  // Filter by resources (e.g., ["s3:*", "s3:bucket/*"])
  repeated string resources = 4 [json_name = "resources"];

  // Filter by effect (e.g., "allow", "deny")
  optional string effect = 5 [json_name = "effect"];

  // Filter by domain/namespace
  optional string domain = 6 [json_name = "domain"];

  // Filter by disabled status
  optional bool disabled = 7 [json_name = "disabled"];

  // Standard pagination fields
  int32 page = 10 [json_name = "page"];
  int32 page_size = 11 [json_name = "page_size"];
  string page_token = 12 [json_name = "page_token"];
  optional string paging_mode = 13 [json_name = "paging_mode"];
  bool only_count = 14 [json_name = "only_count"];
  string keyword = 15 [json_name = "keyword"];

  // Sort criteria (e.g., ["type", "-created_at"])
  repeated string sorting = 20 [json_name = "sorting"];
}

// ListPoliciesResponse contains authorization policies from casbin_rule table.
// The policies are converted from casbin_rule format to authz.PolicySpec format.
message ListPoliciesResponse {
  // The list of policies in authz.PolicySpec format.
  repeated contrib.api.security.authz.v1.PolicySpec policies = 1 [json_name = "policies"];

  // The total number of policies matching the filter.
  int32 total = 2 [json_name = "total"];

  // The current page number.
  int32 page = 3 [json_name = "page"];

  // The number of items per page.
  int32 page_size = 4 [json_name = "page_size"];

  // Token to retrieve next page of results, or empty if there are no more results.
  string next_page_token = 5 [json_name = "next_page_token"];
}
