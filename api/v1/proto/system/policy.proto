syntax = "proto3";

package api.v1.services.system;

option go_package = "origadmin/application/admin/api/v1/services/system;system";
option java_multiple_files = true;
option java_outer_classname = "APIServiceSystemPolicyProto";
option java_package = "com.origadmin.api.v1.services.system";
option objc_class_prefix = "APIServiceSystemPolicy";

// PolicyService defines the contract for providing a complete set of authorization policies.
// This service is consumed by other modules (like auth) to synchronize their state.
// SECURITY: This is a foundational service and should NOT be exposed publicly.
// Access must be restricted at the infrastructure level (e.g., firewall, internal network).
service PolicyService {
  // ListAllPolicies retrieves the entire set of policies (both 'p' and 'g' rules)
  // from the source of truth (the system module).
  // This RPC is intended for internal gRPC calls only, not exposed via HTTP Gateway.
  rpc ListAllPolicies(ListAllPoliciesRequest) returns (ListAllPoliciesResponse);
}

// Represents a single assignment of a semantic permission to a role.
// domain is hardcoded to "*" for single-tenant mode, reserved for future multi-tenant support.
message RolePermission {
  string role_keyword = 1; // Role keyword (stable, immutable identifier)
  string permission_keyword = 2; // Permission keyword (stable, immutable identifier)
  string domain = 3; // Domain identifier, always "*" in single-tenant mode
}

// Represents the definition of a semantic permission.
message PermissionDefinition {
  string permission_keyword = 1; // Permission keyword (stable, immutable identifier)
  string resource_path = 2; // Resource path (e.g., "/api/users")
  string action_verb = 3; // HTTP method (e.g., "GET", "POST")
  string resource_type = 4; // Resource type (e.g., "API")
  string service_name = 5; // Service name (e.g., "system-service")
}

// Represents a single user-role assignment.
// domain is hardcoded to "*" for single-tenant mode, reserved for future multi-tenant support.
message UserRole {
  string user_id = 1; // User ID (format: "user:{id}", e.g., "user:123")
  string role_keyword = 2; // Role keyword (stable, immutable identifier)
  string domain = 3; // Domain identifier, always "*" in single-tenant mode
}

message ListAllPoliciesRequest {}

message ListAllPoliciesResponse {
  repeated RolePermission role_permissions = 1;
  repeated PermissionDefinition permission_definitions = 2;
  repeated UserRole user_roles = 3;
}
