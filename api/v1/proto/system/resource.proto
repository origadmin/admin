syntax = "proto3";

package api.v1.services.system;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "types/system.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/system;system";
option java_multiple_files = true;
option java_outer_classname = "APIServiceSystemResourceProto";
option java_package = "com.origadmin.api.v1.services.system";
option objc_class_prefix = "APIServiceSystemResource";

// The resource service definition.
// A Resource represents a backend asset that requires access control, such as an HTTP API or a gRPC method.
// The definition of the Resource message in types/system.proto should be updated to include fields
// like service_name, path, method, operation, policy, version_id, last_sync_version_id, and sync_status
// as specified in 09_Data_Model_Schema.md.
service ResourceService {
  // Lists all backend resources.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option (google.api.http) = {get: "/sys/resources"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  // Gets a single backend resource.
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {
    option (google.api.http) = {get: "/sys/resources/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  // Creates a new backend resource.
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (google.api.http) = {
      post: "/sys/resources"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  // Updates a backend resource.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse) {
    option (google.api.http) = {
      put: "/sys/resources/{resource.id}"
      body: "resource"
    };
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  // Deletes a backend resource.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (google.api.http) = {delete: "/sys/resources/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
}

// Request message for ResourceService.ListResources.
message ListResourcesRequest {
  int64 id = 1 [json_name = "id"];
  int32 page = 2 [json_name = "page"];
  int32 page_size = 3 [json_name = "page_size"];
  string page_token = 4 [json_name = "page_token"];
  bool no_paging = 5 [json_name = "no_paging"];
  bool only_count = 6 [json_name = "only_count"];
  string keyword = 7 [json_name = "keyword"];
  string service_name = 8 [json_name = "service_name"];
  string sync_status = 9 [json_name = "sync_status"];
}

// Response message for ResourceService.ListResources.
message ListResourcesResponse {
  int32 total = 1 [json_name = "total"];
  repeated api.v1.services.types.Resource resources = 2 [json_name = "resources"];
  int32 page = 3 [json_name = "page"];
  int32 page_size = 4 [json_name = "page_size"];
  string next_page_token = 5 [json_name = "next_page_token"];
  optional google.protobuf.Any extra = 6 [json_name = "extra"];
}

// Request message for ResourceService.GetResource.
message GetResourceRequest {
  int64 id = 1;
}

// Response message for ResourceService.GetResource.
message GetResourceResponse {
  api.v1.services.types.Resource resource = 1;
}

// Request message for ResourceService.CreateResource.
message CreateResourceRequest {
  string parent = 1;
  string resource_id = 2;
  api.v1.services.types.Resource resource = 3;
}

// Response message for ResourceService.CreateResource.
message CreateResourceResponse {
  api.v1.services.types.Resource resource = 1;
}

// Request message for ResourceService.UpdateResource.
message UpdateResourceRequest {
  api.v1.services.types.Resource resource = 1;
}

// Response message for ResourceService.UpdateResource.
message UpdateResourceResponse {
  api.v1.services.types.Resource resource = 1;
}

// Request message for ResourceService.DeleteResource.
message DeleteResourceRequest {
  int64 id = 1;
}

// Response message for ResourceService.DeleteResource.
message DeleteResourceResponse {
  google.protobuf.Empty empty = 1;
}
