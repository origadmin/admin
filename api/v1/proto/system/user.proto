syntax = "proto3";

package api.v1.services.system;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "policy/v1/policy.proto";
import "types/system.proto";

option go_package = "origadmin/application/admin/api/v1/services/system;system";
option java_multiple_files = true;
option java_outer_classname = "APIServiceSystemUserProto";
option java_package = "com.origadmin.api.v1.services.system";
option objc_class_prefix = "APIServiceSystemUser";

// The login service definition.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/sys/users"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc ListUserResources(ListUserResourcesRequest) returns (ListUserResourcesResponse) {
    option (google.api.http) = {get: "/sys/users/{id}/resources"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse) {
    option (google.api.http) = {get: "/sys/users/{id}/roles"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc ListUserPermissions(ListUserPermissionsRequest) returns (ListUserPermissionsResponse) {
    option (google.api.http) = {get: "/sys/users/{id}/permissions"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc ListUserViews(ListUserViewsRequest) returns (ListUserViewsResponse) {
    option (google.api.http) = {get: "/sys/users/{id}/views"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/sys/users/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/sys/users"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/sys/users/{user.id}"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/sys/users/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (UpdateUserStatusResponse) {
    option (google.api.http) = {
      put: "/sys/users/{id}/status"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  // Deprecated: Use UpdateUser with role_ids instead.
  rpc UpdateUserRoles(UpdateUserRolesRequest) returns (UpdateUserRolesResponse) {
    option deprecated = true;
    option (google.api.http) = {
      put: "/sys/users/{id}/roles"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  // ResetUserPassword reset the user s password
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (ChangeUserPasswordResponse) {
    option (google.api.http) = {
      post: "/sys/users/{id}/password"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }

  // InviteUser invite a new user
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse) {
    option (google.api.http) = {
      post: "/sys/users/invite"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "authz"};
  }
}

message ListUserResourcesRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
}

message ListUserResourcesResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The paging resources
  repeated api.v1.services.types.Resource resources = 2 [json_name = "resources"];
}

message ListUserRolesRequest {
  // The field will contain id of the user requested.
  int64 id = 1 [json_name = "id"];
}

message ListUserRolesResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The list of roles
  repeated api.v1.services.types.Role roles = 2 [json_name = "roles"];
}

message ListUserPermissionsRequest {
  // The field will contain id of the user requested.
  int64 id = 1 [json_name = "id"];
}

message ListUserPermissionsResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The list of permissions
  repeated api.v1.services.types.Permission permissions = 2 [json_name = "permissions"];
}

message ListUserViewsRequest {
  // The field will contain id of the user requested.
  int64 id = 1 [json_name = "id"];
}

message ListUserViewsResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The list of views
  repeated api.v1.services.types.View views = 2 [json_name = "views"];
}

message UpdateUserStatusRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
  // The status of the user.
  int32 status = 2 [json_name = "status"];
}

message UpdateUserStatusResponse {}

message ChangeUserPasswordRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
  // The password to use for this user (plain text, will be hashed).
  string password = 2 [json_name = "password"];
}

message ChangeUserPasswordResponse {}

message ListUsersRequest {
  // The page number.
  int32 page = 1 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 2 [json_name = "page_size"];
  // The next_page_token value returned from a previous List request, if any.
  string page_token = 3 [json_name = "page_token"];
  // The paging_mode is used to specify the pagination mode.
  optional string paging_mode = 4 [json_name = "paging_mode"];
  // The only_count is the query parameter for set only to query the total number
  bool only_count = 5 [json_name = "only_count"];
  // The title query parameter for set only to query the title
  string keyword = 6 [json_name = "keyword"];
  // Whether to include roles in the response.
  bool with_roles = 7 [json_name = "with_roles"];
}

message ListUsersResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The paging users
  repeated api.v1.services.types.User users = 2 [json_name = "users"];
  // The page number.
  int32 page = 3 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 4 [json_name = "page_size"];
  // Token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 5 [json_name = "next_page_token"];
  // Additional information about this response.
  // content to be added without destroying the page data format
  optional google.protobuf.Any extra = 6 [json_name = "extra"];
}

message GetUserRequest {
  // The field will contain id of the resource requested.
  int64 id = 1;
  // Whether to include roles in the response.
  bool with_roles = 2 [json_name = "with_roles"];
  // Whether to include profile in the response.
  bool with_profile = 3 [json_name = "with_profile"];
  // Whether to include setting in the response.
  bool with_setting = 4 [json_name = "with_setting"];
}

message GetUserResponse {
  // The user resource for get.
  api.v1.services.types.User user = 1 [json_name = "user"];
}

message CreateUserRequest {
  // The user resource to be created.
  api.v1.services.types.User user = 1;
  // The password to use for this user.
  // If this field is left empty, a random password will be generated by the server.
  string password = 2 [json_name = "password"];
  // For requests: Use this field to set the roles for the user.
  repeated int64 role_ids = 3 [json_name = "role_ids"];
}

message CreateUserResponse {
  // The user resource for create.
  api.v1.services.types.User user = 1 [json_name = "user"];
}

message UpdateUserRequest {
  // The user resource which replaces the resource on the server.
  api.v1.services.types.User user = 1 [json_name = "user"];
  // The update mask applies to the resource. For the `FieldMask` definition,
  // see https://developers.google.com/protocol-buffers/docs/reference/google.protobuf#fieldmask
  google.protobuf.FieldMask update_mask = 2 [json_name = "update_mask"];
  // For requests: Use this field to set or replace the list of roles for the user.
  repeated int64 role_ids = 3 [json_name = "role_ids"];
}

message UpdateUserResponse {
  // The user resource for update.
  api.v1.services.types.User user = 1 [json_name = "user"];
}

message DeleteUserRequest {
  // The resource id of the user to be deleted.
  int64 id = 1;
}

message DeleteUserResponse {
  // The empty response body.
  google.protobuf.Empty empty = 1 [json_name = "empty"];
}

message UpdateUserRolesRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
  // For requests: Use this field to set or replace the list of roles for the user.
  repeated int64 role_ids = 2 [json_name = "role_ids"];
}

message UpdateUserRolesResponse {
  api.v1.services.types.User user = 1 [json_name = "user"];
}

message InviteUserRequest {
  // The email of the user to invite.
  string email = 1 [json_name = "email"];
  // The roles to assign to the invited user.
  repeated int64 role_ids = 2 [json_name = "role_ids"];
}

message InviteUserResponse {
  // The empty response body.
  google.protobuf.Empty empty = 1 [json_name = "empty"];
}
