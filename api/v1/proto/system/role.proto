syntax = "proto3";

package api.v1.services.system;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "types/system.proto";
import "policy/v1/policy.proto";

option go_package = "origadmin/application/admin/api/v1/services/system;system";
option java_multiple_files = true;
option java_outer_classname = "APIServiceSystemRoleProto";
option java_package = "com.origadmin.api.v1.services.system";
option objc_class_prefix = "APIServiceSystemRole";

// The login service definition.
service RoleService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/sys/roles"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {get: "/sys/roles/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/sys/roles"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/sys/roles/{role.id}"
      body: "*"
    };
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/sys/roles/{id}"};
    option (contrib.api.policy.v1.policy) = {name: "jwt-auth"};
  }
}

message ListRolesRequest {
  // The page number.
  int32 page = 1 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 2 [json_name = "page_size"];
  // The next_page_token value returned from a previous List request, if any.
  string page_token = 3 [json_name = "page_token"];
  // The paging_mode is used to specify the pagination mode.
  optional string paging_mode = 4 [json_name = "paging_mode"];
  // The only_count is the query parameter for set only to query the total number
  bool only_count = 5 [json_name = "only_count"];
  // The keyword is the query parameter for set only to query the role by keyword
  string keyword = 6 [json_name = "keyword"];
  // Whether to include permissions in the response.
  bool with_permissions = 7 [json_name = "with_permissions"];
}

message ListRolesResponse {
  // The total number of items in the list.
  int32 total = 1 [json_name = "total"];
  // The paging roles
  repeated api.v1.services.types.Role roles = 2 [json_name = "roles"];
  // The page number.
  int32 page = 3 [json_name = "page"];
  // The maximum number of items to return.
  int32 page_size = 4 [json_name = "page_size"];
  // Token to retrieve the next page of results, or empty if there are no
  // more results in the list.
  string next_page_token = 5 [json_name = "next_page_token"];
  // Additional information about this response.
  // content to be added without destroying the page data format
  optional google.protobuf.Any extra = 6 [json_name = "extra"];
}

message GetRoleRequest {
  // The field will contain id of the resource requested.
  int64 id = 1 [json_name = "id"];
  // Whether to include permissions in the response.
  bool with_permissions = 2 [json_name = "with_permissions"];
}

message GetRoleResponse {
  // The role resource for get.
  api.v1.services.types.Role role = 1 [json_name = "role"];
}

message CreateRoleRequest {
  // The role resource to create.
  api.v1.services.types.Role role = 1 [json_name = "role"];
  // For requests: Use this field to set the permissions for the role.
  repeated int64 permission_ids = 2 [json_name = "permission_ids"];
  // For requests: Use this field to set the resources for the role.
  repeated int64 resource_ids = 3 [json_name = "resource_ids"];
  // For requests: Use this field to set the views for the role.
  repeated int64 view_ids = 4 [json_name = "view_ids"];
}

message CreateRoleResponse {
  // The role resource for create.
  api.v1.services.types.Role role = 1 [json_name = "role"];
}

message UpdateRoleRequest {
  // The role resource which replaces the resource on the server.
  // The 'id' from this object will be used to identify the role to update.
  api.v1.services.types.Role role = 1 [json_name = "role"];

  // For requests: Use this field to set or replace the list of permissions for the role.
  // - To update permissions, provide a list of IDs: [1, 2, 3]
  // - To clear all permissions, provide an empty list: []
  // - To leave permissions unchanged, do not provide this field at all (leave it as nil).
  repeated int64 permission_ids = 2 [json_name = "permission_ids"];
  // For requests: Use this field to set or replace the list of resources for the role.
  repeated int64 resource_ids = 3 [json_name = "resource_ids"];
  // For requests: Use this field to set or replace the list of views for the role.
  repeated int64 view_ids = 4 [json_name = "view_ids"];
}

message UpdateRoleResponse {
  // The role resource for update.
  api.v1.services.types.Role role = 1 [json_name = "role"];
}

message DeleteRoleRequest {
  // The resource id of the role to be deleted.
  int64 id = 1 [json_name = "id"];
}

message DeleteRoleResponse {
  google.protobuf.Empty empty = 1;
}
