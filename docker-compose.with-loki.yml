#
# This is an optional log collection configuration template for evaluation and testing purposes only
# Contains the following AGPL 3.0 licensed software:
# - Grafana Loki (log storage)
# - Grafana Promtail (log collection)  
# - Grafana (visualization)
#
# 🚨 Legal Risk Warning:
# AGPL 3.0 license requires that if you provide services to third parties over the network,
# you must provide source code access to users.
